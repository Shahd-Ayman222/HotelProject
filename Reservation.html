<!DOCTYPE html>
<html>

<head>
    <title>Reservation</title>
    <script src="./Script.js"></script>
    <link href="./Stylepage4.css" rel="Stylesheet">
</head>

<body>
    <h1>Book Reservation</h1>
    <form>
        <label>Name:</label>
        <input type="text" required>
        <br><br>
        <label>Email:</label>
        <input type="email" required>
        <br><br>
        <label>Choose Room Type:</label>
        <select id="roomPrice">
            <option value="150">
                Single Room - $150
            </option>
            <option value="250">
                Double Room - $250
            </option>
            <option value="400">
                Suite - $400
            </option>
        </select>
        <br><br>
        <label>Number of Nights:</label>
        <input type="number" id="nights" min="1">
        <br><br>
        <button type="button" onclick="calculateTotal()">
            Calculate Total
        </button>
        <h2 id="result"></h2>
        <br>
        <input type="submit" value="Confirm Booking">
    </form>
</body>

</html>
